<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ubiquitous</title>
  <meta name="description" content="Say what everyone says: a game about thinking like the crowd.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath fill='%2316A45A' fill-rule='evenodd' d='M26 6h48a20 20 0 0 1 20 20v48a20 20 0 0 1-20 20H26A20 20 0 0 1 6 74V26A20 20 0 0 1 26 6Zm24 28a16 16 0 1 0 0 32 16 16 0 0 0 0-32Z'/%3E%3C/svg%3E">
  <style>
    :root{ --bg:#FFB84D; --ink:#2b2b29; --muted:#74726a; --panel:#fffaf0; --line:#2b2b29; --accent:#D56062; --bar:#2b2b29; }
    [data-theme="dark"]{ --bg:#3f403e; --ink:#FFB84D; --muted:#b9b08f; --panel:#4b4c49; --line:#1b1b1a; --accent:#ff9aa0; --bar:#FFB84D; }
    *{ margin:0; box-sizing:border-box; }
    html,body{ min-height:100%; }
    body{ min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
      font-family:"Orbitron",sans-serif; color:var(--ink); background:var(--bg); padding:56px 16px 32px;
      transition:background-color .25s, color .25s; overflow-x:hidden; }

    /* the crowd: answers drifting everywhere behind the game */
    .crowd{ position:fixed; inset:0; overflow:hidden; pointer-events:none; z-index:0; }
    .crowd span{ position:absolute; font-family:"Press Start 2P",monospace; color:var(--ink); white-space:nowrap;
      text-transform:uppercase; animation:drift 14s ease-in-out infinite alternate; }
    @keyframes drift{ from{ transform:translate(0,0) rotate(var(--r)); } to{ transform:translate(var(--dx),var(--dy)) rotate(var(--r)); } }
    @media (prefers-reduced-motion: reduce){ .crowd span{ animation:none; } }

    .toggle{ position:fixed; top:14px; right:14px; z-index:2; font-family:"Press Start 2P",monospace; font-size:9px;
      padding:9px 11px; border:3px solid var(--line); border-radius:6px; background:var(--panel); color:var(--ink);
      cursor:pointer; box-shadow:3px 3px 0 var(--line); }
    .toggle:active{ transform:translate(2px,2px); box-shadow:none; }

    .card{ position:relative; z-index:1; width:100%; max-width:560px; background:var(--panel); border:3px solid var(--line);
      border-radius:10px; box-shadow:6px 6px 0 var(--line); padding:28px 24px; text-align:center; }
    h1{ font-family:"Press Start 2P",monospace; font-size:clamp(1.1rem,6vw,1.9rem); line-height:1.4;
      text-shadow:3px 3px 0 rgba(0,0,0,.15); word-break:break-word; }
    .tag{ margin-top:10px; font-weight:700; color:var(--accent); letter-spacing:.06em; }
    .rules{ margin:22px auto 0; max-width:42ch; line-height:1.65; color:var(--muted); font-weight:500; }
    .rules strong{ color:var(--ink); }
    .meta{ margin-top:16px; font-size:.75rem; color:var(--muted); min-height:1em; }

    .btn{ display:inline-block; margin-top:22px; font-family:"Press Start 2P",monospace; font-size:11px; letter-spacing:.05em;
      padding:14px 18px; border:3px solid var(--line); border-radius:6px; background:var(--accent); color:#fffaf0;
      cursor:pointer; box-shadow:4px 4px 0 var(--line); }
    .btn:hover{ filter:brightness(1.05); }
    .btn:active{ transform:translate(2px,2px); box-shadow:none; }
    .btn:disabled{ opacity:.55; cursor:default; }
    .btn:focus-visible, input:focus-visible, .toggle:focus-visible{ outline:3px dashed var(--accent); outline-offset:3px; }

    .progress{ display:flex; justify-content:space-between; font-family:"Press Start 2P",monospace; font-size:9px;
      color:var(--muted); margin:22px 0 14px; padding-top:14px; border-top:2px dashed var(--line); gap:8px; }
    .prompt{ font-family:"Press Start 2P",monospace; font-size:clamp(.85rem,4vw,1.15rem); line-height:1.7; min-height:3.4em;
      display:flex; align-items:center; justify-content:center; }
    form{ display:flex; gap:10px; margin-top:16px; }
    form .btn{ margin-top:0; flex:none; }
    input{ flex:1; min-width:0; font:inherit; font-size:1rem; font-weight:700; color:var(--ink); background:var(--bg);
      border:3px solid var(--line); border-radius:6px; padding:12px; }
    .sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

    .result{ margin-top:22px; text-align:left; }
    .verdict{ text-align:center; line-height:1.6; }
    .verdict .word{ font-family:"Press Start 2P",monospace; font-size:.85rem; text-transform:uppercase; color:var(--accent);
      word-break:break-word; }
    .verdict .pct{ display:block; margin-top:6px; font-family:"Press Start 2P",monospace; font-size:1.6rem; }
    .verdict .say{ display:block; margin-top:8px; color:var(--muted); font-size:.8rem; }
    .bars{ list-style:none; padding:0; margin-top:18px; display:grid; gap:7px; }
    .bars li{ display:grid; grid-template-columns:minmax(0,9.5em) 1fr 3.2em; align-items:center; gap:10px; font-size:.78rem; font-weight:700; }
    .bars .label{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-transform:lowercase; }
    .bars .track{ height:14px; border:2px solid var(--line); border-radius:4px; overflow:hidden; background:var(--bg); }
    .bars .fill{ display:block; height:100%; background:var(--bar); width:0; transition:width .6s ease; }
    .bars .n{ text-align:right; color:var(--muted); }
    .bars li.you .label, .bars li.you .n{ color:var(--accent); }
    .bars li.you .fill{ background:var(--accent); }
    .bars li.gap{ display:block; text-align:center; color:var(--muted); font-size:.7rem; }
    .result .btn{ display:block; margin:20px auto 0; }

    .score{ font-family:"Press Start 2P",monospace; font-size:clamp(2.2rem,12vw,3.6rem); margin-top:18px; color:var(--accent);
      text-shadow:4px 4px 0 var(--line); }
    .score-label{ font-family:"Press Start 2P",monospace; font-size:10px; margin-top:12px; }
    .rank{ margin-top:16px; font-weight:700; line-height:1.6; }
    .recap{ list-style:none; padding:0; margin:20px 0 0; text-align:left; display:grid; gap:6px; font-size:.78rem; }
    .recap li{ display:flex; justify-content:space-between; gap:12px; border-bottom:2px dashed var(--line); padding-bottom:6px; }
    .recap .q{ color:var(--muted); }
    .recap .a{ font-weight:900; text-align:right; }
    .error{ margin-top:14px; color:var(--accent); font-weight:700; min-height:1em; }
    a.home{ position:relative; z-index:1; margin-top:22px; font-weight:700; color:var(--ink); text-decoration:none; letter-spacing:.1em; font-size:.8rem; }
    a.home:hover{ text-decoration:underline; }
    [hidden]{ display:none !important; }
  </style>
  <script src="vendor/pocketbase.umd.js"></script>
  <script src="pb-auth.js"></script>
</head>
<body>
  <div class="crowd" id="crowd" aria-hidden="true"></div>
  <button class="toggle" id="theme" type="button">DARK</button>

  <main class="card">
    <h1>UBIQUITOUS</h1>
    <p class="tag">Say what everyone says.</p>

    <section id="start">
      <p class="rules">Five prompts. Answer with the first thing that comes to mind.
        You score the <strong>share of everyone</strong> who said the same thing.
        The most common answer wins: <strong>be ubiquitous</strong>.</p>
      <button class="btn" id="play" type="button" disabled>PLAY</button>
      <p class="meta" id="games">Asking the crowd…</p>
    </section>

    <section id="round" hidden>
      <div class="progress"><span id="step">ROUND 1/5</span><span id="running">0% SO FAR</span></div>
      <h2 class="prompt" id="prompt"></h2>
      <form id="form" autocomplete="off">
        <label class="sr" for="answer">Your answer</label>
        <input id="answer" name="answer" maxlength="40" required placeholder="Your answer">
        <button class="btn" id="say" type="submit">SAY IT</button>
      </form>
      <div class="result" id="result" aria-live="polite" hidden>
        <p class="verdict" id="verdict"></p>
        <ol class="bars" id="bars"></ol>
        <button class="btn" id="next" type="button">NEXT</button>
      </div>
    </section>

    <section id="end" hidden>
      <p class="score" id="score">0%</p>
      <p class="score-label">UBIQUITOUS</p>
      <p class="rank" id="rank"></p>
      <ol class="recap" id="recap"></ol>
      <button class="btn" id="again" type="button">PLAY AGAIN</button>
    </section>

    <p class="error" id="error" role="alert"></p>
  </main>
  <a class="home" href="https://create.solhann.net">&larr; back to the gallery</a>

  <script>
    // theme, as every solhann app does it
    const root = document.documentElement, themeBtn = document.getElementById('theme');
    const setTheme = (t) => { root.setAttribute('data-theme', t); themeBtn.textContent = t === 'dark' ? 'LIGHT' : 'DARK'; try { localStorage.setItem('solhann_theme', t); } catch (_) {} };
    let savedTheme = 'light'; try { savedTheme = localStorage.getItem('solhann_theme') || 'light'; } catch (_) {}
    setTheme(savedTheme);
    themeBtn.onclick = () => setTheme(root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');

    const ROUNDS = 5;
    const pb = PBAuth.getClient();
    const $ = (id) => document.getElementById(id);
    const api = (path, body) => pb.send(path, body ? { method: 'POST', body } : { method: 'GET' });
    const pct = (n, total) => (total ? Math.round((100 * n) / total) : 0);
    const show = (id) => ['start', 'round', 'end'].forEach((s) => { $(s).hidden = s !== id; });
    const fail = (err) => {
      const msg = err && err.response && err.response.message;
      $('error').textContent = msg || "Couldn't reach the crowd. Try again in a moment.";
    };

    let prompts = [], picks = [], round = 0, plays = [];

    // The crowd: words scattered across the page, bigger the more people said them.
    const crowd = $('crowd');
    function sprinkle(words) {
      words.forEach(({ text, weight }) => {
        const copies = Math.max(1, Math.round(weight * 6));
        for (let i = 0; i < copies; i++) {
          const s = document.createElement('span');
          s.textContent = text;
          s.style.left = (Math.random() * 96) + '%';
          s.style.top = (Math.random() * 96) + '%';
          s.style.fontSize = (9 + weight * 22) + 'px';
          s.style.opacity = (0.06 + weight * 0.12).toFixed(2);
          s.style.setProperty('--r', ((Math.random() - 0.5) * 24).toFixed(1) + 'deg');
          s.style.setProperty('--dx', ((Math.random() - 0.5) * 60).toFixed(0) + 'px');
          s.style.setProperty('--dy', ((Math.random() - 0.5) * 60).toFixed(0) + 'px');
          s.style.animationDelay = (-Math.random() * 14).toFixed(1) + 's';
          crowd.appendChild(s);
        }
      });
      while (crowd.children.length > 90) crowd.removeChild(crowd.firstChild);
    }
    sprinkle(['say', 'what', 'everyone', 'says'].map((text) => ({ text, weight: 0.5 })));

    function shuffle(list) {
      const a = list.slice();
      for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
      return a;
    }

    async function load() {
      try {
        const d = await api('/api/ubiq/prompts');
        prompts = d.prompts;
        $('games').textContent = d.games === 1 ? '1 game played so far.' : d.games + ' games played so far.';
        $('play').disabled = false;
      } catch (err) {
        $('games').textContent = '';
        fail(err);
      }
    }

    function startGame() {
      $('error').textContent = '';
      picks = shuffle(prompts).slice(0, ROUNDS);
      round = 0;
      plays = [];
      show('round');
      showRound();
    }

    function showRound() {
      const avg = plays.length ? Math.round(plays.reduce((t, p) => t + p.share, 0) / plays.length) : 0;
      $('step').textContent = 'ROUND ' + (round + 1) + '/' + ROUNDS;
      $('running').textContent = plays.length ? avg + '% SO FAR' : '';
      $('prompt').textContent = picks[round].text;
      $('answer').value = '';
      $('answer').disabled = false;
      $('say').disabled = false;
      $('form').hidden = false;
      $('result').hidden = true;
      $('answer').focus();
    }

    function verdictFor(r) {
      if (r.mine === 1) return 'Truly unique. Not very ubiquitous.';
      if (r.share >= 20) return 'Ubiquitous. The crowd agrees.';
      if (r.share >= 10) return 'Pretty common.';
      if (r.share >= 4) return 'A bit niche.';
      return 'Rare.';
    }

    function renderResult(r) {
      const v = $('verdict');
      v.textContent = '';
      const word = document.createElement('span'); word.className = 'word'; word.textContent = r.answer;
      const big = document.createElement('span'); big.className = 'pct'; big.textContent = r.share + '%';
      const say = document.createElement('span'); say.className = 'say';
      say.textContent = (r.mine === 1 ? 'Only you' : r.mine + ' of ' + r.total + ' people') + ' said that. ' + verdictFor(r);
      v.append(word, big, say);

      const bars = $('bars');
      bars.textContent = '';
      const most = r.top.length ? r.top[0].n : 1;
      const row = (answer, n, you) => {
        const li = document.createElement('li');
        if (you) li.className = 'you';
        const label = document.createElement('span'); label.className = 'label'; label.textContent = (you ? '▸ ' : '') + answer;
        const track = document.createElement('span'); track.className = 'track';
        const fill = document.createElement('span'); fill.className = 'fill'; track.appendChild(fill);
        const count = document.createElement('span'); count.className = 'n'; count.textContent = pct(n, r.total) + '%';
        li.append(label, track, count);
        bars.appendChild(li);
        requestAnimationFrame(() => requestAnimationFrame(() => { fill.style.width = Math.max(3, (100 * n) / most) + '%'; }));
      };
      let shown = false;
      r.top.forEach((t) => { const you = t.answer === r.answer; shown = shown || you; row(t.answer, t.n, you); });
      if (!shown) {
        const gap = document.createElement('li'); gap.className = 'gap'; gap.textContent = '…'; bars.appendChild(gap);
        row(r.answer, r.mine, true);
      }
      sprinkle(r.top.map((t) => ({ text: t.answer, weight: Math.min(1, t.n / r.total * 2.5) })));
    }

    async function submit(ev) {
      ev.preventDefault();
      const answer = $('answer').value.trim();
      if (!answer) return;
      $('error').textContent = '';
      $('answer').disabled = true;
      $('say').disabled = true;
      try {
        const r = await api('/api/ubiq/answer', { prompt: picks[round].id, answer });
        plays.push({ prompt: picks[round].text, answer: r.answer, share: r.share });
        $('form').hidden = true;
        $('result').hidden = false;
        $('next').textContent = round + 1 < ROUNDS ? 'NEXT' : 'SEE YOUR SCORE';
        renderResult(r);
        $('next').focus();
      } catch (err) {
        $('answer').disabled = false;
        $('say').disabled = false;
        $('answer').focus();
        fail(err);
      }
    }

    async function finish() {
      const score = Math.round(plays.reduce((t, p) => t + p.share, 0) / plays.length);
      $('score').textContent = score + '%';
      $('rank').textContent = '';
      const recap = $('recap');
      recap.textContent = '';
      plays.forEach((p) => {
        const li = document.createElement('li');
        const q = document.createElement('span'); q.className = 'q'; q.textContent = p.prompt;
        const a = document.createElement('span'); a.className = 'a'; a.textContent = p.answer + ' · ' + p.share + '%';
        li.append(q, a);
        recap.appendChild(li);
      });
      show('end');
      $('again').focus();
      try {
        const r = await api('/api/ubiq/finish', { score });
        $('rank').textContent = r.games === 1
          ? 'The first game ever finished. The crowd starts with you.'
          : 'More ubiquitous than ' + r.betterThan + '% of the ' + (r.games - 1) + ' games before yours.';
      } catch (err) {
        fail(err);
      }
    }

    $('play').onclick = startGame;
    $('again').onclick = startGame;
    $('form').onsubmit = submit;
    $('next').onclick = () => { round += 1; if (round < ROUNDS) showRound(); else finish(); };
    load();
  </script>
</body>
</html>
